spring.application.name=smart-parking-system

# Server Configuration
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/smart_parking_db
spring.datasource.username=root
spring.datasource.password=manager
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Hibernate Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Security
jwt.secret=SmartParkingApplicationJwtSecretKeyForCdacProject2026SecureKey
jwt.expiration=86400000


# Logging Microservice (.NET) - a completely separate application with
# its own database. This backend just calls its POST /api/logs endpoint
# over plain HTTP whenever something important happens.
logging.service.url=http://localhost:5100/api/logs
